<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>APEX IRON v4.2 — Pro Strength & Calisthenics</title>
  <link id="pwa-manifest" rel="manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090B;
      --surface: #121216;
      --surface-2: #1A1A20;
      --surface-3: #23232B;
      --border: #272730;
      --text: #F4F4F6;
      --muted: #8E8E9E;
      --orange: #FF5500;
      --orange-light: #FF7733;
      --orange-glow: rgba(255, 85, 0, 0.16);
      --green: #22C55E;
      --gold: #F59E0B;
      --blue: #38BDF8;
      --purple: #A855F7;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 78px; }

    /* TOP BAR MINIMAL */
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-weight: 800; font-size: 1.12rem; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--orange); }
    .ver-pill { font-size: 0.65rem; background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); color: var(--orange); padding: 2px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

    /* WORKOUT CONTEXTUAL TIMER + LIVE STATS DOCK */
    .workout-timer-dock {
      background: linear-gradient(180deg, #191412 0%, #121216 100%);
      border: 1px solid rgba(255, 85, 0, 0.4); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; position: relative; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .timer-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--orange); transition: width 0.3s linear; }
    .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #timer-display { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.55rem; color: var(--orange); cursor: pointer; letter-spacing: -0.5px; }
    .timer-ctrl-group { display: flex; align-items: center; gap: 6px; }
    .timer-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 0.82rem; cursor: pointer; padding: 8px 11px; border-radius: 10px; }
    .timer-btn:active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .timer-btn-play { background: var(--orange); border-color: var(--orange); color: #fff; min-width: 42px; }
    .live-metrics-strip { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; padding-top: 8px; font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* CONTAINER & CARDS */
    #main-content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px; flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .hero-card { background: linear-gradient(145deg, #191615 0%, #111115 100%); border-color: rgba(255,85,0,0.3); }
    .card-title { font-weight: 700; font-size: 1.02rem; }
    .section-title { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.9px; color: var(--muted); margin: 16px 0 10px; font-weight: 700; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82rem; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .badge-orange { display: inline-flex; align-items: center; gap: 4px; background: var(--orange-glow); color: var(--orange); font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-gold { display: inline-flex; align-items: center; gap: 4px; background: rgba(245, 158, 11, 0.18); color: var(--gold); font-weight: 800; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .full-width { width: 100%; }

    /* RANK BADGES */
    .rank-pill { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.4px; }
    .rank-Novizio, .rank-Novice { background: #27272A; color: #A1A1AA; }
    .rank-Principiante, .rank-Beginner { background: rgba(56, 189, 248, 0.16); color: var(--blue); }
    .rank-Intermedio, .rank-Intermediate { background: rgba(34, 197, 94, 0.16); color: var(--green); }
    .rank-Avanzato, .rank-Advanced { background: var(--orange-glow); color: var(--orange); }
    .rank-Élite, .rank-Elite { background: rgba(168, 85, 247, 0.2); color: var(--purple); border: 1px solid rgba(168,85,247,0.4); }

    /* BUTTONS & INPUTS */
    .btn-primary { background: var(--orange); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 0.88rem; transition: opacity 0.15s; }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
    .btn-outline { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-size: 0.84rem; }
    .btn-danger-ghost { background: transparent; color: var(--red); border: none; font-weight: 600; cursor: pointer; padding: 6px 10px; font-size: 0.84rem; }
    .btn-icon { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 6px 9px; cursor: pointer; font-size: 0.86rem; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .input-field { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; outline: none; }
    .input-field:focus { border-color: var(--orange); }

    /* SUB-TABS & CHIPS */
    .subtab-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); padding: 5px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; }
    .subtab-btn { background: transparent; border: none; color: var(--muted); font-weight: 700; font-size: 0.82rem; padding: 8px; border-radius: 8px; cursor: pointer; }
    .subtab-btn.active { background: var(--orange); color: #fff; }
    .chip-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip-bar::-webkit-scrollbar { display: none; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); border-radius: 99px; padding: 6px 13px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* BODYWEIGHT ROTARY DRUM PICKER */
    .bw-wheel-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
    .bw-drum {
      height: 54px; width: 112px; overflow-y: scroll; scroll-snap-type: y mandatory;
      background: var(--bg); border: 1px solid var(--orange); border-radius: 10px;
      text-align: center; scrollbar-width: none; position: relative;
    }
    .bw-drum::-webkit-scrollbar { display: none; }
    .bw-drum-item { height: 54px; line-height: 54px; scroll-snap-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.15rem; color: var(--orange); }

    /* WORKOUT LOGGER */
    .workout-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .ex-log-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .prev-ghost { font-size: 0.78rem; color: var(--orange); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
    .notes-input { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--muted); font-size: 0.82rem; padding: 6px 0; margin: 6px 0 10px; outline: none; }
    .sets-head, .set-row { display: grid; grid-template-columns: 24px 50px 1fr 1fr 42px 42px 34px; gap: 5px; align-items: center; text-align: center; }
    .sets-head { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .set-row { padding: 4px 0; border-radius: 8px; transition: background 0.2s; }
    .set-done { background: rgba(34, 197, 94, 0.13); }
    .set-pr-row { box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.5); }
    .set-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .set-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 3px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.88rem; }
    .set-select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 2px; font-weight: 700; font-size: 0.76rem; text-align: center; }
    .type-W { color: var(--blue); } .type-D { color: var(--gold); } .type-F { color: var(--red); } .type-RP { color: var(--purple); }
    .set-check { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; margin: 0 auto; }

    /* PLATE CALCULATOR VISUAL */
    .plate-bar-visual { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 18px 10px; background: var(--bg); border-radius: 12px; margin: 12px 0; min-height: 96px; }
    .bar-shaft { width: 34px; height: 12px; background: #71717A; border-radius: 2px; }
    .plate-disc { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 800; color: #fff; writing-mode: vertical-rl; text-orientation: mixed; }

    /* ANATOMY SVG & DONUT CHART */
    .anatomy-container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 16px; padding: 10px 0; }
    .body-svg { width: 135px; height: 250px; }
    .donut-wrapper { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .legend-list { display: grid; gap: 6px; font-size: 0.8rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* EXERCISE TECHNICAL ILLUSTRATION BOX */
    .tech-diagram-box { background: #0E0E12; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
    .alt-box { background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin-top: 8px; border-left: 3px solid var(--orange); }

    /* HISTORY CARDS & CALENDAR */
    .history-card { border-left: 3px solid var(--orange); cursor: pointer; }
    .history-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--surface-2); padding: 8px 10px; border-radius: 10px; margin: 10px 0; text-align: center; }
    .history-details-drawer { border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 10px; display: none; }
    .history-card.expanded .history-details-drawer { display: block; }
    .suggestion-box { background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.84rem; margin-top: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .cal-day { background: var(--surface-2); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; min-height: 42px; }
    .cal-trained { background: var(--orange); color: #fff; font-weight: 700; }
    .cal-today { border: 1px solid #fff; }
    .cal-suggested { border: 1px dashed var(--orange); color: var(--orange); }
    .chart-svg { width: 100%; height: 150px; background: var(--surface-2); border-radius: 10px; margin: 8px 0; }
    .muscle-bars-grid { display: grid; gap: 10px; margin-top: 12px; }
    .progress-track { width: 100%; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; border-radius: 99px; }

    /* CUSTOM MODAL / BOTTOM SHEET */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
