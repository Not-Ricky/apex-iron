<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>APEX IRON v4.5 — Pro Strength & Calisthenics</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090B;
      --surface: #121216;
      --surface-2: #1A1A20;
      --surface-3: #23232B;
      --border: #272730;
      --text: #F4F4F6;
      --muted: #8E8E9E;
      --orange: #FF5500;
      --orange-light: #FF7733;
      --orange-glow: rgba(255, 85, 0, 0.16);
      --green: #22C55E;
      --gold: #F59E0B;
      --blue: #38BDF8;
      --purple: #A855F7;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 78px; overscroll-behavior-y: contain; }

    /* TOP BAR MINIMAL */
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      background: #09090B; border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-weight: 800; font-size: 1.12rem; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--orange); }
    .ver-pill { font-size: 0.65rem; background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); color: var(--orange); padding: 2px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

    /* WORKOUT CONTEXTUAL TIMER + LIVE STATS DOCK */
    .workout-timer-dock {
      background: linear-gradient(180deg, #191412 0%, #121216 100%);
      border: 1px solid rgba(255, 85, 0, 0.4); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; position: relative; overflow: hidden;
    }
    .timer-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--orange); will-change: width; }
    .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #timer-display { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.55rem; color: var(--orange); cursor: pointer; letter-spacing: -0.5px; }
    .timer-ctrl-group { display: flex; align-items: center; gap: 5px; }
    .timer-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 0.8rem; cursor: pointer; padding: 8px 10px; border-radius: 10px; }
    .timer-btn:active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .timer-btn-play { background: var(--orange); border-color: var(--orange); color: #fff; min-width: 40px; }
    .wake-active { border-color: var(--gold); color: var(--gold); background: rgba(245, 158, 11, 0.14); }
    .live-metrics-strip { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; padding-top: 8px; font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* CONTAINER & CARDS */
    #main-content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px; flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; contain: content; }
    .hero-card { background: linear-gradient(145deg, #191615 0%, #111115 100%); border-color: rgba(255,85,0,0.3); }
    .card-title { font-weight: 700; font-size: 1.02rem; }
    .section-title { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.9px; color: var(--muted); margin: 16px 0 10px; font-weight: 700; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82rem; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .badge-orange { display: inline-flex; align-items: center; gap: 4px; background: var(--orange-glow); color: var(--orange); font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-gold { display: inline-flex; align-items: center; gap: 4px; background: rgba(245, 158, 11, 0.18); color: var(--gold); font-weight: 800; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; }
    .badge-superset { display: inline-flex; align-items: center; gap: 4px; background: rgba(168, 85, 247, 0.2); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.45); font-weight: 800; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .full-width { width: 100%; }

    /* SUPERSET GROUP STYLING */
    .superset-card { border-left: 4px solid var(--purple); background: linear-gradient(145deg, #16131C 0%, #121216 100%); }
    .superset-connected-top { margin-bottom: 4px; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
    .superset-connected-mid { margin-bottom: 4px; border-radius: 6px; }
    .superset-connected-bot { border-top-left-radius: 6px; border-top-right-radius: 6px; }

    /* RANK BADGES */
    .rank-pill { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.4px; }
    .rank-Novizio, .rank-Novice { background: #27272A; color: #A1A1AA; }
    .rank-Principiante, .rank-Beginner { background: rgba(56, 189, 248, 0.16); color: var(--blue); }
    .rank-Intermedio, .rank-Intermediate { background: rgba(34, 197, 94, 0.16); color: var(--green); }
    .rank-Avanzato, .rank-Advanced { background: var(--orange-glow); color: var(--orange); }
    .rank-Élite, .rank-Elite { background: rgba(168, 85, 247, 0.2); color: var(--purple); border: 1px solid rgba(168,85,247,0.4); }

    /* BUTTONS & INPUTS */
    .btn-primary { background: var(--orange); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
    .btn-primary:active { opacity: 0.85; }
    .btn-outline { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-size: 0.84rem; }
    .btn-danger { background: rgba(239, 68, 68, 0.16); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; font-size: 0.84rem; }
    .btn-danger-ghost { background: transparent; color: var(--red); border: none; font-weight: 600; cursor: pointer; padding: 6px 10px; font-size: 0.84rem; }
    .btn-icon { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 6px 8px; cursor: pointer; font-size: 0.84rem; }
    .btn-sm { padding: 6px 11px; font-size: 0.78rem; }
    .input-field { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; outline: none; }
    .input-field:focus { border-color: var(--orange); }

    /* SUB-TABS & CHIPS */
    .subtab-bar-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: var(--surface); padding: 5px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; }
    .subtab-btn { background: transparent; border: none; color: var(--muted); font-weight: 700; font-size: 0.78rem; padding: 8px 4px; border-radius: 8px; cursor: pointer; }
    .subtab-btn.active { background: var(--orange); color: #fff; }
    .chip-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip-bar::-webkit-scrollbar { display: none; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); border-radius: 99px; padding: 6px 13px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* BODYWEIGHT ROTARY DRUM PICKER */
    .bw-wheel-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
    .bw-drum {
      height: 54px; width: 112px; overflow-y: scroll; scroll-snap-type: y mandatory;
      background: var(--bg); border: 1px solid var(--orange); border-radius: 10px;
      text-align: center; scrollbar-width: none; position: relative;
    }
    .bw-drum::-webkit-scrollbar { display: none; }
    .bw-drum-item { height: 54px; line-height: 54px; scroll-snap-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.15rem; color: var(--orange); }

    /* WORKOUT LOGGER & EDITOR */
    .workout-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .ex-log-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .prev-ghost { font-size: 0.78rem; color: var(--orange); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
    .notes-input { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--muted); font-size: 0.82rem; padding: 6px 0; margin: 6px 0 10px; outline: none; }
    .sets-head, .set-row { display: grid; grid-template-columns: 24px 50px 1fr 1fr 42px 42px 34px; gap: 5px; align-items: center; text-align: center; }
    .sets-head { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .set-row { padding: 4px 0; border-radius: 8px; }
    .set-done { background: rgba(34, 197, 94, 0.13); }
    .set-pr-row { box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.5); }
    .set-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .set-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 3px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.88rem; }
    .set-select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 2px; font-weight: 700; font-size: 0.76rem; text-align: center; }
    .type-W { color: var(--blue); } .type-D { color: var(--gold); } .type-F { color: var(--red); } .type-RP { color: var(--purple); }
    .set-check { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; margin: 0 auto; }

    /* PLATE CALCULATOR & WARM-UP VISUAL */
    .plate-bar-visual { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 18px 10px; background: var(--bg); border-radius: 12px; margin: 12px 0; min-height: 96px; }
    .bar-shaft { width: 34px; height: 12px; background: #71717A; border-radius: 2px; }
    .plate-disc { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 800; color: #fff; writing-mode: vertical-rl; text-orientation: mixed; }
    .warmup-preview-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface-2); border-radius: 8px; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }

    /* ANATOMY SVG & DONUT CHART */
    .anatomy-container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 16px; padding: 10px 0; }
    .body-svg { width: 135px; height: 250px; }
    .donut-wrapper { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .legend-list { display: grid; gap: 6px; font-size: 0.8rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* EXERCISE TECHNICAL ILLUSTRATION BOX */
    .tech-diagram-box { background: #0E0E12; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
    .alt-box { background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin-top: 8px; border-left: 3px solid var(--orange); }

    /* HISTORY CARDS & BODY MEASUREMENTS */
    .history-card { border-left: 3px solid var(--orange); cursor: pointer; }
    .history-time-pill { font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
    .history-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface-2); padding: 9px 8px; border-radius: 10px; margin: 10px 0; text-align: center; }
    .history-details-drawer { border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 12px; }
    .workout-mini-analytics { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .routine-ex-preview { list-style: none; margin-top: 8px; font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
    .builder-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--surface-2); border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; }
    .body-grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }

    /* CALENDAR & CHARTS */
    .suggestion-box { background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.84rem; margin-top: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .cal-day { background: var(--surface-2); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; min-height: 42px; }
    .cal-trained { background: var(--orange); color: #fff; font-weight: 700; }
    .cal-today { border: 1px solid #fff; }
    .cal-suggested { border: 1px dashed var(--orange); color: var(--orange); }
    .chart-svg { width: 100%; height: 155px; background: var(--surface-2); border-radius: 10px; margin: 8px 0; }
    .muscle-bars-grid { display: grid; gap: 10px; margin-top: 12px; }
    .progress-track { width: 100%; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; border-radius: 99px; }

    /* CUSTOM MODAL / BOTTOM SHEET */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; padding: 20px; }

    /* AI COACH & REPORTS */
    .chat-box { min-height: 220px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; max-width: 90%; }
    .msg-user { background: var(--orange); color: #fff; align-self: flex-end; }
    .msg-ai { background: var(--surface-2); border: 1px solid var(--border); align-self: flex-start; }
    .report-box { background: #15151B; border: 1px solid rgba(255,85,0,0.35); border-radius: 14px; padding: 14px; font-size: 0.88rem; line-height: 1.55; margin-top: 10px; }

    /* NAVIGATION BAR */
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: #121216; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px;
    }
    .nav-btn { background: transparent; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; font-weight: 600; cursor: pointer; padding: 4px 8px; }
    .nav-btn.active { color: var(--orange); }
    .nav-icon { font-size: 1.18rem; }

    /* INSTALL BANNER */
    .install-banner {
      background: linear-gradient(90deg, #1E1612 0%, #16161C 100%);
      border: 1px solid rgba(255,85,0,0.45); border-radius: 14px; padding: 11px 14px;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    @media (min-width: 768px) {
      body { padding-bottom: 0; padding-left: 215px; }
      .nav-bar {
        top: 0; right: auto; width: 215px; flex-direction: column; justify-content: flex-start;
        border-top: none; border-right: 1px solid var(--border); padding: 72px 12px 16px; gap: 8px;
      }
      .nav-btn { flex-direction: row; font-size: 0.9rem; padding: 12px 14px; border-radius: 12px; width: 100%; gap: 12px; }
      .nav-btn.active { background: var(--orange-glow); }
      .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .muscle-bars-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .modal-backdrop { align-items: center; }
      .modal-sheet { border-radius: 20px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR PULITA -->
  <header class="top-bar">
    <div class="brand">APEX<span>IRON</span> <span class="ver-pill">v4.5</span></div>
    <div class="row-gap">
      <button class="btn-primary btn-sm" id="top-install-btn" style="display:none" onclick="triggerInstallPrompt()">📲 Installa App</button>
      <button class="btn-icon small" id="sync-status-btn" onclick="state.analyticsSubTab='calendar';switchTab('analytics')" title="Cloud Sync">☁️</button>
      <button class="btn-icon small" id="lang-toggle" onclick="toggleLanguage()">IT</button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main id="main-content"></main>

  <!-- MODALE CUSTOM -->
  <div id="custom-modal" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" id="modal-body"></div>
  </div>

  <!-- NAVIGAZIONE PRINCIPALE A 5 TAB -->
  <nav class="nav-bar">
    <button class="nav-btn active" data-tab="workout" onclick="switchTab('workout')">
      <span class="nav-icon">🏋️</span><span data-i18n="nav_workout">Workout</span>
    </button>
    <button class="nav-btn" data-tab="routines" onclick="switchTab('routines')">
      <span class="nav-icon">📋</span><span data-i18n="nav_routines">Schede</span>
    </button>
    <button class="nav-btn" data-tab="exercises" onclick="switchTab('exercises')">
      <span class="nav-icon">📖</span><span data-i18n="nav_exercises">Esercizi</span>
    </button>
    <button class="nav-btn" data-tab="analytics" onclick="switchTab('analytics')">
      <span class="nav-icon">📊</span><span data-i18n="nav_analytics">Analisi</span>
    </button>
    <button class="nav-btn" data-tab="coach" onclick="switchTab('coach')">
      <span class="nav-icon">🤖</span><span data-i18n="nav_coach">AI Coach</span>
    </button>
  </nav>

  <script>
    // ================= REGISTRAZIONE SERVICE WORKER & PROMPT INSTALLAZIONE NATIVO =================
    let deferredInstallPrompt = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const topBtn = document.getElementById('top-install-btn');
      if (topBtn) topBtn.style.display = 'inline-flex';
      if (state.currentTab === 'workout' && !state.activeWorkout) renderWorkoutTab();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      const topBtn = document.getElementById('top-install-btn');
      if (topBtn) topBtn.style.display = 'none';
      if (state.currentTab === 'workout' && !state.activeWorkout) renderWorkoutTab();
    });

    async function triggerInstallPrompt() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredInstallPrompt = null;
        const topBtn = document.getElementById('top-install-btn');
        if (topBtn) topBtn.style.display = 'none';
      }
    }

    function isAppStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    // ================= WAKE LOCK INTELLIGENTE (SCHERMO SEMPRE ACCESO DURANTE WORKOUT) =================
    let wakeLockSentinel = null;
    let wakeLockEnabled = true;

    async function requestWakeLock() {
      if (!wakeLockEnabled || !state.activeWorkout || document.hidden) return;
      try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; updateWakeLockUI(); });
          updateWakeLockUI();
        }
      } catch (e) {}
    }

    async function releaseWakeLock() {
      try {
        if (wakeLockSentinel) {
          await wakeLockSentinel.release();
          wakeLockSentinel = null;
          updateWakeLockUI();
        }
      } catch (e) {}
    }

    function toggleWakeLockManual() {
      wakeLockEnabled = !wakeLockEnabled;
      if (wakeLockEnabled) requestWakeLock();
      else releaseWakeLock();
      updateWakeLockUI();
    }

    function updateWakeLockUI() {
      const btn = document.getElementById('wake-lock-btn');
      if (!btn) return;
      btn.classList.toggle('wake-active', wakeLockEnabled && !!wakeLockSentinel);
      btn.title = wakeLockEnabled ? 'Schermo sempre acceso: ATTIVO' : 'Schermo sempre acceso: DISATTIVATO';
    }

    // ================= DIAGRAMMI VETTORIALI ESPLICATIVI ESERCIZI =================
    function getExerciseDiagramSVG(ex) {
      const p = ex.primary;

    // ================= SUPERSET HELPER (CALCOLO ETICHETTE A1, A2, B1... E LOGICA TIMER) =================
    function computeSupersetBadges(exercises) {
      const badges = new Array(exercises.length).fill(null);
      const groupTotals = {};
      exercises.forEach(ex => {
        if (ex.supersetId) groupTotals[ex.supersetId] = (groupTotals[ex.supersetId] || 0) + 1;
      });
      const validGroupLetters = {};
      let nextLetterCode = 65; // 'A'
      Object.keys(groupTotals).forEach(gid => {
        if (groupTotals[gid] >= 2) {
          validGroupLetters[gid] = String.fromCharCode(nextLetterCode++);
        }
      });
      const groupCounters = {};
      exercises.forEach((ex, idx) => {
        const gid = ex.supersetId;
        if (gid && validGroupLetters[gid]) {
          groupCounters[gid] = (groupCounters[gid] || 0) + 1;
          const pos = groupCounters[gid];
          const total = groupTotals[gid];
          badges[idx] = {
            gid,
            label: `${validGroupLetters[gid]}${pos}`,
            isFirst: pos === 1,
            isLast: pos === total,
            total
          };
        }
      });
      return badges;
    }

    function toggleSupersetLink(exIndex) {
      if (!state.activeWorkout) return;
      const list = state.activeWorkout.exercises;
      const cur = list[exIndex];
      const next = list[exIndex + 1];

      if (cur.supersetId) {
        // Scollega questo esercizio dal superset
        const oldGid = cur.supersetId;
        delete cur.supersetId;
        const remaining = list.filter(e => e.supersetId === oldGid);
        if (remaining.length < 2) remaining.forEach(e => delete e.supersetId);
      } else if (next) {
        // Collega con l'esercizio successivo
        const gid = next.supersetId || ('ss_' + Date.now());
        cur.supersetId = gid;
        next.supersetId = gid;
      } else if (exIndex > 0) {
        // Se è l'ultimo della lista, collega con il precedente
        const prev = list[exIndex - 1];
        const gid = prev.supersetId || ('ss_' + Date.now());
        prev.supersetId = gid;
        cur.supersetId = gid;
      }
      saveState();
      renderWorkoutTab();
    }

    // ================= RICALCOLO AUTOMATICO STATISTICHE & PR SU TUTTO LO STORICO =================
    function recalculateEntireHistoryStats() {
      state.history.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
      const runningBest1RM = {};
      const runningBestWeight = {};

      state.history.forEach(w => {
        let totalVolume = 0, prCount = 0;
        if (!w.startTime) w.startTime = new Date(w.date).getTime() - ((w.durationMin || 45) * 60000);
        if (!w.endTime) w.endTime = new Date(w.date).getTime();
        w.durationMin = Math.max(1, Math.round((w.endTime - w.startTime) / 60000));

        (w.exercises || []).forEach(ex => {
          const prevBest = runningBest1RM[ex.exerciseId] || 0;
          let sessionBest = prevBest;
          let maxW = runningBestWeight[ex.exerciseId] || 0;

          (ex.sets || []).forEach(s => {
            s.isPR = false;
            if (s.done) {
              const kg = parseFloat(s.weight) || 0;
              const reps = parseInt(s.reps) || 0;
              totalVolume += kg * reps;
              if (kg > maxW) maxW = kg;
              if (kg > 0 && reps > 0 && s.type !== 'W') {
                const est1RM = kg * (1 + reps / 30);
                if (est1RM > sessionBest) {
                  s.isPR = true;
                  prCount++;
                  sessionBest = est1RM;
                }
              }
            }
          });
          runningBest1RM[ex.exerciseId] = sessionBest;
          runningBestWeight[ex.exerciseId] = maxW;
        });

        w.totalVolume = Math.round(totalVolume * 10) / 10;
        w.prCount = prCount;
      });

      cached1RMMap = {};
      Object.keys(runningBest1RM).forEach(id => {
        cached1RMMap[id] = {
          best1RM: Math.round((runningBest1RM[id] || 0) * 10) / 10,
          bestWeight: runningBestWeight[id] || 0
        };
      });
    }

    // ================= CLOUD SYNC & DEBOUNCED PERSISTENCE =================
    let syncEventSource = null;
    let saveDebounceTimer = null;
    let cloudDebounceTimer = null;

    function updateSyncIcon(status) {
      const btn = document.getElementById('sync-status-btn');
      if (!btn) return;
      btn.textContent = status === 'synced' ? '☁️✅' : status === 'syncing' ? '☁️🔄' : status === 'error' ? '☁️⚠️' : '☁️';
    }

    function getCleanFirebaseEndpoint() {
      const url = (state.fbUrl || '').trim().replace(/\/+$/, '');
      const pin = (state.fbPin || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
      return (url && pin) ? `${url}/${pin}.json` : null;
    }

    function mergeById(localArr, remoteArr) {
      const map = new Map();
      (remoteArr || []).forEach(item => map.set(item.id, item));
      (localArr || []).forEach(item => map.set(item.id, item));
      return Array.from(map.values());
    }

    async function pushToCloud() {
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint) return;
      updateSyncIcon('syncing');
      try {
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bodyweight: state.bodyweight,
            bodyLogs: state.bodyLogs,
            customExercises: state.customExercises,
            routines: state.routines,
            history: state.history,
            activeWorkout: state.activeWorkout,
            lastUpdated: state.lastUpdated
          })
        });
        updateSyncIcon(res.ok ? 'synced' : 'error');
      } catch (e) { updateSyncIcon('error'); }
    }

    async function pullFromCloud(forceOverwrite = false) {
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint) return;
      updateSyncIcon('syncing');
      try {
        const res = await fetch(endpoint);
        if (!res.ok) { updateSyncIcon('error'); return; }
        const remote = await res.json();
        if (remote && (forceOverwrite || (remote.lastUpdated && remote.lastUpdated > state.lastUpdated))) {
          if (remote.bodyweight) state.bodyweight = remote.bodyweight;
          if (remote.bodyLogs) state.bodyLogs = forceOverwrite ? remote.bodyLogs : mergeById(state.bodyLogs, remote.bodyLogs);
          if (remote.customExercises) { state.customExercises = mergeById(state.customExercises, remote.customExercises); rebuildExerciseCache(); }
          if (remote.routines) state.routines = forceOverwrite ? remote.routines : mergeById(state.routines, remote.routines);
          if ('history' in remote) state.history = remote.history || [];
          if ('activeWorkout' in remote) state.activeWorkout = remote.activeWorkout;
          state.lastUpdated = remote.lastUpdated || Date.now();
          recalculateEntireHistoryStats();
          persistLocalOnly();
          renderCurrentView();
        } else if (!remote && (state.history.length > 0 || state.bodyLogs.length > 0)) {
          await pushToCloud();
        }
        updateSyncIcon('synced');
      } catch (e) { updateSyncIcon('error'); }
    }

    function startRealtimeSyncListener() {
      if (syncEventSource) { syncEventSource.close(); syncEventSource = null; }
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint || document.hidden) { updateSyncIcon(endpoint ? 'synced' : 'idle'); return; }
      pullFromCloud();
      try {
        syncEventSource = new EventSource(endpoint);
        syncEventSource.addEventListener('put', (e) => {
          const remote = JSON.parse(e.data).data;
          if (remote && remote.lastUpdated && remote.lastUpdated > state.lastUpdated) {
            if (remote.bodyweight) state.bodyweight = remote.bodyweight;
            if (remote.bodyLogs) state.bodyLogs = mergeById(state.bodyLogs, remote.bodyLogs);
            if (remote.customExercises) { state.customExercises = mergeById(state.customExercises, remote.customExercises); rebuildExerciseCache(); }
            if (remote.routines) state.routines = mergeById(state.routines, remote.routines);
            if ('history' in remote) state.history = remote.history || [];
            if ('activeWorkout' in remote) state.activeWorkout = remote.activeWorkout;
            state.lastUpdated = remote.lastUpdated;
            recalculateEntireHistoryStats();
            persistLocalOnly();
            renderCurrentView();
            updateSyncIcon('synced');
          }
        });
      } catch (e) {}
    }

    // ================= GENERATORE WARM-UP AUTOMATICO =================
    function openWarmupGeneratorModal(exIndex) {
      const exItem = state.activeWorkout.exercises[exIndex];
      const dbEx = getExercise(exItem.exerciseId);
      const firstWorking = exItem.sets.find(s => s.type !== 'W' && parseFloat(s.weight) > 0);
      const { bestWeight } = getBest1RMForExercise(exItem.exerciseId);
      const defaultTarget = firstWorking ? parseFloat(firstWorking.weight) : (bestWeight || 60);

      const computeWarmupSets = (targetKg) => {
        const w = parseFloat(targetKg) || 20;
        const round25 = (val) => Math.max(20, Math.round(val / 2.5) * 2.5);
        if (w <= 25) {
          return [{ weight: w, reps: 10, pct: '100%' }];
        }
        const plan = [
          { weight: 20, reps: 10, pct: 'Bilanciere' },
          { weight: round25(w * 0.50), reps: 6, pct: '50%' },
          { weight: round25(w * 0.70), reps: 3, pct: '70%' },
          { weight: round25(w * 0.85), reps: 1, pct: '85%' }
        ];
        // Rimuove eventuali duplicati di peso
        const unique = [];
        plan.forEach(p => { if (!unique.some(u => u.weight === p.weight)) unique.push(p); });
        return unique;
      };

      const renderPreview = (val) => {

    // ================= TIMER DI RECUPERO ZERO-WAKE + AUDIO DOPPIO BEEP + NOTIFICA SISTEMA =================
    let sharedAudioCtx = null;

    function requestNotificationPermissionOnce() {
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
      } catch (e) {}
    }

    function sendRestCompleteNotification() {
      try {
        if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
          new Notification('APEX IRON — Recupero Terminato ⏱️', {
            body: 'È il momento della prossima serie!',
            tag: 'apex-rest-timer',
            renotify: true
          });
        }
      } catch (e) {}
    }

    function playBeep() {
      try {
        if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
        const now = sharedAudioCtx.currentTime;
        // Doppio tono acustico nitido (880Hz -> 1175Hz)
        [880, 1174.66].forEach((freq, i) => {
          const osc = sharedAudioCtx.createOscillator();
          const gain = sharedAudioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.22);
          gain.gain.setValueAtTime(0.38, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.22 + 0.2);
          osc.connect(gain);
          gain.connect(sharedAudioCtx.destination);
          osc.start(now + i * 0.22);
          osc.stop(now + i * 0.22 + 0.2);
        });
        if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 400]);
      } catch (e) {}
      sendRestCompleteNotification();
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.ceil(sec));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function syncTimerFromClock() {
      if (!state.timer.running) return;
      const diff = Math.ceil((state.timer.endTime - Date.now()) / 1000);
      if (diff <= 0) {
        state.timer.remaining = 0;
        state.timer.running = false;
        clearInterval(state.timer.interval);
        state.timer.interval = null;
        updateTimerUI();
        playBeep();
      } else {
        state.timer.remaining = diff;
        updateTimerUI();
      }
    }

    function updateTimerUI() {
      const disp = document.getElementById('timer-display');
      const bar = document.getElementById('timer-progress');
      const toggleBtn = document.getElementById('timer-toggle-btn');
      if (!disp) return;
      disp.textContent = formatTime(state.timer.remaining);
      if (bar) bar.style.width = `${Math.min(100, (state.timer.remaining / Math.max(1, state.timer.defaultSeconds)) * 100)}%`;
      if (toggleBtn) toggleBtn.textContent = state.timer.running ? '⏸' : '▶';
    }

    function startTimer(customSec = null) {
      requestNotificationPermissionOnce();
      if (customSec !== null) { state.timer.defaultSeconds = customSec; state.timer.remaining = customSec; }
      clearInterval(state.timer.interval);
      state.timer.endTime = Date.now() + state.timer.remaining * 1000;
      state.timer.running = true;
      updateTimerUI();
      if (!document.hidden) {
        state.timer.interval = setInterval(syncTimerFromClock, 1000);
      }
    }

    function toggleTimer() {
      if (state.timer.running) {
        syncTimerFromClock();
        clearInterval(state.timer.interval);
        state.timer.interval = null;
        state.timer.running = false;
        updateTimerUI();
      } else {
        if (state.timer.remaining <= 0) state.timer.remaining = state.timer.defaultSeconds;
        startTimer();
      }
    }

    function adjustTimer(delta) {
      if (state.timer.running) syncTimerFromClock();
      state.timer.remaining = Math.max(0, state.timer.remaining + delta);
      if (state.timer.remaining > state.timer.defaultSeconds) state.timer.defaultSeconds = state.timer.remaining;
      if (state.timer.running) state.timer.endTime = Date.now() + state.timer.remaining * 1000;
      updateTimerUI();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (state.timer.interval) { clearInterval(state.timer.interval); state.timer.interval = null; }
        if (syncEventSource) { syncEventSource.close(); syncEventSource = null; }
      } else {
        if (state.timer.running) {
          syncTimerFromClock();
          if (state.timer.running && !state.timer.interval) {
            state.timer.interval = setInterval(syncTimerFromClock, 1000);
          }
        }
        requestWakeLock();
        startRealtimeSyncListener();
      }
    });

    function openTimerInputModal() {
      openModal(`
        <h3 style="margin-bottom:10px">⏱️ ${state.lang === 'it' ? 'Imposta Recupero (secondi)' : 'Set Rest Timer (seconds)'}</h3>
        <input type="number" id="modal-timer-sec" inputmode="numeric" class="input-field mono" style="font-size:1.3rem;text-align:center" value="${state.timer.remaining}">
        <div class="chip-bar" style="margin:12px 0">
          ${[60, 90, 120, 180, 240].map(s => `<button class="chip" onclick="document.getElementById('modal-timer-sec').value=${s}">${formatTime(s)}</button>`).join('')}
        </div>
        <div class="row-gap">
          <button class="btn-primary full-width" onclick="
            const val = parseInt(document.getElementById('modal-timer-sec').value);
            if (!isNaN(val) && val >= 5) {

    // ================= RANKING DI FORZA & RECORD PERSONALI (PR) =================
    function getBest1RMForExercise(exerciseId) {
      if (!cached1RMMap) recalculateEntireHistoryStats();
      return cached1RMMap[exerciseId] || { best1RM: 0, bestWeight: 0 };
    }

    function calculateStrengthRank(exerciseId, oneRM) {
      if (!oneRM || oneRM <= 0) return state.lang === 'it' ? 'Novizio' : 'Novice';
      const bw = Math.max(40, state.bodyweight || 75);
      const isBwWeighted = (exerciseId === 'pullups_pronated' || exerciseId === 'chinups_supinated' || exerciseId === 'dips_chest');
      const effectiveLoad = isBwWeighted ? (bw + oneRM) : oneRM;
      const ratio = effectiveLoad / bw;
      const std = STRENGTH_STANDARDS[exerciseId] || [0.4, 0.7, 1.0, 1.3];

      const labels = state.lang === 'it'
        ? ['Novizio', 'Principiante', 'Intermedio', 'Avanzato', 'Élite']
        : ['Novice', 'Beginner', 'Intermediate', 'Advanced', 'Elite'];

      if (ratio >= std[3]) return labels[4];
      if (ratio >= std[2]) return labels[3];
      if (ratio >= std[1]) return labels[2];
      if (ratio >= std[0]) return labels[1];
      return labels[0];
    }

    // ================= WORKOUT ATTIVO =================
    function startWorkout(routineId = null) {
      requestNotificationPermissionOnce();
      const routine = routineId ? state.routines.find(r => r.id === routineId) : null;
      state.activeWorkout = {
        id: 'w_' + Date.now(),
        name: routine ? routine.name : (state.lang === 'it' ? 'Allenamento Libero' : 'Freestyle Workout'),
        routineId, startTime: Date.now(),
        exercises: routine ? routine.exercises.map(exId => ({
          exerciseId: exId, notes: '', sets: [{ type: 'N', weight: '', reps: '', rir: '2', rpe: '8', done: false, isPR: false }]
        })) : []
      };
      saveState(true);
      requestWakeLock();
      switchTab('workout');
    }

    function repeatPastWorkout(historyIndex) {
      requestNotificationPermissionOnce();
      const past = state.history[historyIndex];
      if (!past) return;
      state.activeWorkout = {
        id: 'w_' + Date.now(),
        name: past.name,
        routineId: past.routineId || null,
        startTime: Date.now(),
        exercises: past.exercises.map(ex => ({
          exerciseId: ex.exerciseId,
          supersetId: ex.supersetId || null,
          notes: ex.notes || '',
          sets: ex.sets.map(s => ({ ...s, done: false, isPR: false }))
        }))
      };
      saveState(true);
      requestWakeLock();
      switchTab('workout');
    }

    function getPreviousPerformance(exerciseId) {
      for (let i = state.history.length - 1; i >= 0; i--) {
        const found = state.history[i].exercises.find(e => e.exerciseId === exerciseId);
        if (found && found.sets.some(s => s.done)) {
          const valid = found.sets.filter(s => s.done && s.type !== 'W');
          const list = valid.length ? valid : found.sets.filter(s => s.done);
          return list.map(s => `${s.weight || 0}kg×${s.reps || 0}${s.rir !== '' ? `@RIR${s.rir}` : ''}`).join(' | ');
        }
      }
      return null;
    }

    function copyLastSetValues(exIndex) {
      const ex = state.activeWorkout.exercises[exIndex];
      if (!ex.sets.length) return;
      let refW = '', refR = '';
      for (let i = ex.sets.length - 1; i >= 0; i--) {
        if (ex.sets[i].weight || ex.sets[i].reps) { refW = ex.sets[i].weight; refR = ex.sets[i].reps; break; }
      }
      if (!refW && !refR) {
        for (let i = state.history.length - 1; i >= 0; i--) {
          const found = state.history[i].exercises.find(e => e.exerciseId === ex.exerciseId);
          if (found && found.sets.length) { refW = found.sets[0].weight; refR = found.sets[0].reps; break; }
        }
      }
      const targetSet = ex.sets.find(s => !s.done) || ex.sets[ex.sets.length - 1];
      if (refW) targetSet.weight = refW;
      if (refR) targetSet.reps = refR;
      saveState(); renderWorkoutTab();
    }

    function addSetToActive(exIndex) {
      const ex = state.activeWorkout.exercises[exIndex];
      const last = ex.sets[ex.sets.length - 1] || { type: 'N', weight: '', reps: '', rir: '2', rpe: '8' };
      ex.sets.push({ ...last, done: false, isPR: false });
      saveState(); renderWorkoutTab();
    }

    function updateSetField(exIndex, setIndex, field, value) {
      const exItem = state.activeWorkout.exercises[exIndex];
      const set = exItem.sets[setIndex];
      set[field] = value;

      if (field === 'done' && value === true) {
        // Verifica Superset: il timer parte solo se NON è in superset oppure se è l'ULTIMO esercizio del blocco superset
        const ssBadges = computeSupersetBadges(state.activeWorkout.exercises);
        const ssInfo = ssBadges[exIndex];
        if (!ssInfo || ssInfo.isLast) {
          startTimer(state.timer.defaultSeconds);
        }

        const kg = parseFloat(set.weight) || 0;
        const reps = parseInt(set.reps) || 0;
        if (kg > 0 && reps > 0 && set.type !== 'W') {
          const est = kg * (1 + reps / 30);
          const { best1RM } = getBest1RMForExercise(exItem.exerciseId);
          set.isPR = est > best1RM;
        }
      }
      saveState();
      if (field === 'done' || field === 'type') renderWorkoutTab();
    }

    function removeSet(exIndex, setIndex) {
      state.activeWorkout.exercises[exIndex].sets.splice(setIndex, 1);
      saveState(); renderWorkoutTab();
    }

    function finishWorkout() {
      if (!state.activeWorkout) return;
      const endTime = Date.now();
      const startTime = state.activeWorkout.startTime || (endTime - 45 * 60000);
      const durationMin = Math.max(1, Math.round((endTime - startTime) / 60000));
      state.history.push({
        ...state.activeWorkout,
        startTime,
        endTime,
        date: new Date(endTime).toISOString(),
        durationMin
      });
      state.activeWorkout = null;
      clearInterval(state.timer.interval); state.timer.interval = null; state.timer.running = false;
      releaseWakeLock();
      recalculateEntireHistoryStats();
      saveState(true);
      state.analyticsSubTab = 'history';
      switchTab('analytics');
    }

    // ================= CALCOLI MUSCOLARI (PERIODO E SINGOLO WORKOUT) =================
    function calculateMuscleStats(daysBack = 7) {
      const cutoff = Date.now() - daysBack * 86400000;
      const stats = {};
      Object.keys(MUSCLE_GROUPS).forEach(m => stats[m] = { sets: 0, lastTrained: null, recoveryPct: 100 });
      state.history.forEach(w => {
        const wTime = new Date(w.date).getTime();
        w.exercises.forEach(exItem => {
          const dbEx = getExercise(exItem.exerciseId);
          const workingSets = exItem.sets.filter(s => s.done && s.type !== 'W').length;
          if (workingSets > 0) {
            if (!stats[dbEx.primary].lastTrained || wTime > stats[dbEx.primary].lastTrained) stats[dbEx.primary].lastTrained = wTime;
            if (wTime >= cutoff) {
              stats[dbEx.primary].sets += workingSets;
              (dbEx.secondary || []).forEach(sec => { if (stats[sec]) stats[sec].sets += workingSets * 0.5; });
            }
          }
        });
      });
      const now = Date.now();
      Object.keys(stats).forEach(m => {
        const reqHours = MUSCLE_GROUPS[m].recoveryHours;
        if (stats[m].lastTrained && reqHours > 0) {
          stats[m].recoveryPct = Math.min(100, Math.round(((now - stats[m].lastTrained) / 3600000 / reqHours) * 100));
        }
      });
      return stats;
    }

    function calculateSingleWorkoutMuscles(workout) {
      const map = {};
      (workout.exercises || []).forEach(exItem => {
        const dbEx = getExercise(exItem.exerciseId);
        const workingSets = (exItem.sets || []).filter(s => s.done && s.type !== 'W').length;
        const fallbackSets = (exItem.sets || []).filter(s => s.done).length;
        const count = workingSets > 0 ? workingSets : fallbackSets;
        if (count > 0 && dbEx.primary && dbEx.primary !== 'mobility') {
          map[dbEx.primary] = (map[dbEx.primary] || 0) + count;
          (dbEx.secondary || []).forEach(sec => {
            if (sec !== 'mobility') map[sec] = (map[sec] || 0) + count * 0.5;
          });
        }
      });
      return Object.keys(map)
        .map(k => ({ key: k, label: MUSCLE_GROUPS[k][state.lang], sets: map[k], color: MUSCLE_GROUPS[k].color }))
        .sort((a, b) => b.sets - a.sets);
    }

    function getSuggestedNextWorkout() {
      if (!state.routines.length) return null;
      const muscleStats = calculateMuscleStats(7);
      let bestRoutine = state.routines[0], bestScore = -1;
      state.routines.forEach(r => {
        if (!r.exercises.length) return;
        let sumRec = 0;
        r.exercises.forEach(exId => { sumRec += (muscleStats[getExercise(exId).primary]?.recoveryPct ?? 100); });
        const avgRec = sumRec / r.exercises.length;
        if (avgRec > bestScore) { bestScore = avgRec; bestRoutine = r; }
      });
      return { routine: bestRoutine, readiness: Math.round(bestScore) };
    }

    function getExerciseProgression(exerciseId) {
      const points = [];
      state.history.forEach(w => {
        const ex = w.exercises.find(e => e.exerciseId === exerciseId);
        if (ex) {
          let max1RM = 0, vol = 0;
          ex.sets.forEach(s => {
            if (s.done && s.type !== 'W') {
              const kg = parseFloat(s.weight) || 0, reps = parseInt(s.reps) || 0;
              vol += kg * reps;
              const est = kg * (1 + reps / 30);
              if (est > max1RM) max1RM = est;
            }
          });
          if (max1RM > 0 || vol > 0) {
            points.push({
              date: new Date(w.date).toLocaleDateString(state.lang === 'it' ? 'it-IT' : 'en-US', { day: '2-digit', month: '2-digit' }),
              value: Math.round(max1RM * 10) / 10, volume: Math.round(vol)
            });
          }
        }
      });
      return points;
    }

      container.innerHTML = `

                <div class="row-gap">
                  <button class="btn-primary btn-sm" onclick="startWorkout('${r.id}')">${t('start_routine')}</button>
                  <button class="btn-icon" onclick="openRoutineBuilder('${r.id}')">✏️</button>
                  <button class="btn-icon" onclick="deleteRoutine('${r.id}')">🗑️</button>

    function openRoutineBuilder(id = null) {
      editingRoutineId = id;
      document.getElementById('routine-builder-box').style.display = 'block';
      if (id) {
        const r = state.routines.find(x => x.id === id);
        document.getElementById('builder-name').value = r.name;
        tempRoutineExercises = [...r.exercises];
      } else {
        document.getElementById('builder-name').value = '';
        tempRoutineExercises = [];
      }
      renderBuilderList();
    }

    function renderBuilderList() {
      document.getElementById('builder-ex-list').innerHTML = tempRoutineExercises.map((id, idx) => `
        <div class="builder-item">
          <span>${idx + 1}. ${getExercise(id).name[state.lang]}</span>
          <button class="btn-danger-ghost" onclick="tempRoutineExercises.splice(${idx},1);renderBuilderList();">✕</button>
        </div>
      `).join('');
    }

    function saveRoutineBuilder() {
      const name = document.getElementById('builder-name').value.trim() || 'Custom Routine';
      if (editingRoutineId) {
        const idx = state.routines.findIndex(r => r.id === editingRoutineId);
        if (idx !== -1) state.routines[idx] = { ...state.routines[idx], name, exercises: tempRoutineExercises };
      } else {
        state.routines.push({ id: 'r_' + Date.now(), name, exercises: tempRoutineExercises });
      }
      saveState(true); renderRoutinesTab();
    }

    function deleteRoutine(id) {
      if (!confirm(state.lang === 'it' ? 'Eliminare questa scheda?' : 'Delete this routine?')) return;
      state.routines = state.routines.filter(r => r.id !== id);
      saveState(true); renderRoutinesTab();
    }

    // --- TAB 4: ANALISI (MUSCOLI, CORPO & MISURE, STORICO, CALENDARIO) ---
    function renderAnalyticsTab() {
      const container = document.getElementById('main-content');
      container.innerHTML = `
        <div class="subtab-bar-4">
          <button class="subtab-btn ${state.analyticsSubTab==='muscles'?'active':''}" onclick="state.analyticsSubTab='muscles';renderAnalyticsTab()">${t('sub_muscles')}</button>

      else if (state.analyticsSubTab === 'history') renderHistorySubtab();
      else renderCalendarSubtab();

    // --- SOTTO-TAB MISURE CORPOREE & DIARIO PESO ---
    function renderBodyMeasurementsSubtab() {
      const box = document.getElementById('analytics-sub-content');
      const sortedLogs = [...state.bodyLogs].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
      const latest = sortedLogs[sortedLogs.length - 1] || {};
      const metric = state.selectedBodyMetric;

      const metricLabels = {
        weight: { label: 'Peso Corporeo', unit: 'kg' },
        bf: { label: 'Massa Grassa (BF%)', unit: '%' },
        chest: { label: 'Petto', unit: 'cm' },
        arm: { label: 'Braccio', unit: 'cm' },
        waist: { label: 'Vita', unit: 'cm' },
        thigh: { label: 'Coscia', unit: 'cm' }
      };

      const chartPoints = sortedLogs
        .filter(l => l[metric] !== undefined && l[metric] !== '' && !isNaN(parseFloat(l[metric])))
        .map(l => ({
          date: new Date(l.date).toLocaleDateString(state.lang === 'it' ? 'it-IT' : 'en-US', { day: '2-digit', month: '2-digit' }),
          value: parseFloat(l[metric])
        }));

      box.innerHTML = `
        <div class="card">
          <h3>📏 Registra Misure Corporee</h3>
          <p class="small muted" style="margin-top:4px">Aggiornando il peso corporeo vengono ricalibrati automaticamente anche i Ranking di Forza.</p>
          <div class="body-grid-inputs">
            <div>
              <label class="small muted">Peso (kg)</label>
              <input type="number" step="0.1" id="bm-weight" class="input-field mono" value="${latest.weight || state.bodyweight}">
            </div>
            <div>
              <label class="small muted">BF (%)</label>
              <input type="number" step="0.1" id="bm-bf" class="input-field mono" placeholder="14.5" value="${latest.bf || ''}">
            </div>
            <div>
              <label class="small muted">Petto (cm)</label>
              <input type="number" step="0.5" id="bm-chest" class="input-field mono" placeholder="102" value="${latest.chest || ''}">
            </div>
            <div>
              <label class="small muted">Braccio (cm)</label>
              <input type="number" step="0.5" id="bm-arm" class="input-field mono" placeholder="38" value="${latest.arm || ''}">
            </div>
            <div>
              <label class="small muted">Vita (cm)</label>
              <input type="number" step="0.5" id="bm-waist" class="input-field mono" placeholder="78" value="${latest.waist || ''}">
            </div>
            <div>
              <label class="small muted">Coscia (cm)</label>
              <input type="number" step="0.5" id="bm-thigh" class="input-field mono" placeholder="58" value="${latest.thigh || ''}">
            </div>
          </div>
          <input type="text" id="bm-notes" class="input-field" placeholder="Note condizione fisica, idratazione..." style="margin-bottom:10px">
          <button class="btn-primary full-width" onclick="saveBodyMeasurement()">💾 Salva Misurazione</button>
        </div>

        <div class="card">
          <div class="ex-log-header">
            <h3>📈 Andamento Nel Tempo</h3>
            <select class="set-select" style="padding:6px 10px" onchange="state.selectedBodyMetric=this.value;renderBodyMeasurementsSubtab()">
              ${Object.keys(metricLabels).map(k => `<option value="${k}" ${metric===k?'selected':''}>${metricLabels[k].label} (${metricLabels[k].unit})</option>`).join('')}
            </select>
          </div>
          ${renderSVGChart(chartPoints, metricLabels[metric].unit)}
        </div>

        <h3 class="section-title">Storico Misurazioni (${sortedLogs.length})</h3>
        ${sortedLogs.length === 0 ? `<div class="card"><p class="muted small">Nessuna misurazione registrata finora.</p></div>` : ''}
        ${[...sortedLogs].reverse().map(log => `
          <div class="card">
            <div class="ex-log-header">
              <div>
                <strong>📅 ${new Date(log.date).toLocaleDateString(state.lang === 'it' ? 'it-IT' : 'en-US', { day: '2-digit', month: 'short', year: 'numeric' })}</strong>

            </div>
            <div class="mono small" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:10px">
              ${log.weight ? `<span>⚖️ <strong>${log.weight} kg</strong></span>` : ''}
