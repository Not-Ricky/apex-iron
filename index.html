<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>APEX IRON v4.2 — Pro Strength & Calisthenics</title>
  <link id="pwa-manifest" rel="manifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090B;
      --surface: #121216;
      --surface-2: #1A1A20;
      --surface-3: #23232B;
      --border: #272730;
      --text: #F4F4F6;
      --muted: #8E8E9E;
      --orange: #FF5500;
      --orange-light: #FF7733;
      --orange-glow: rgba(255, 85, 0, 0.16);
      --green: #22C55E;
      --gold: #F59E0B;
      --blue: #38BDF8;
      --purple: #A855F7;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 78px; }

    /* TOP BAR MINIMAL */
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-weight: 800; font-size: 1.12rem; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--orange); }
    .ver-pill { font-size: 0.65rem; background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); color: var(--orange); padding: 2px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

    /* WORKOUT CONTEXTUAL TIMER + LIVE STATS DOCK */
    .workout-timer-dock {
      background: linear-gradient(180deg, #191412 0%, #121216 100%);
      border: 1px solid rgba(255, 85, 0, 0.4); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; position: relative; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .timer-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--orange); transition: width 0.3s linear; }
    .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #timer-display { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.55rem; color: var(--orange); cursor: pointer; letter-spacing: -0.5px; }
    .timer-ctrl-group { display: flex; align-items: center; gap: 6px; }
    .timer-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 0.82rem; cursor: pointer; padding: 8px 11px; border-radius: 10px; }
    .timer-btn:active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .timer-btn-play { background: var(--orange); border-color: var(--orange); color: #fff; min-width: 42px; }
    .live-metrics-strip { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; padding-top: 8px; font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* CONTAINER & CARDS */
    #main-content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px; flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .hero-card { background: linear-gradient(145deg, #191615 0%, #111115 100%); border-color: rgba(255,85,0,0.3); }
    .card-title { font-weight: 700; font-size: 1.02rem; }
    .section-title { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.9px; color: var(--muted); margin: 16px 0 10px; font-weight: 700; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82rem; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .badge-orange { display: inline-flex; align-items: center; gap: 4px; background: var(--orange-glow); color: var(--orange); font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-gold { display: inline-flex; align-items: center; gap: 4px; background: rgba(245, 158, 11, 0.18); color: var(--gold); font-weight: 800; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .full-width { width: 100%; }

    /* RANK BADGES */
    .rank-pill { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.4px; }
    .rank-Novizio, .rank-Novice { background: #27272A; color: #A1A1AA; }
    .rank-Principiante, .rank-Beginner { background: rgba(56, 189, 248, 0.16); color: var(--blue); }
    .rank-Intermedio, .rank-Intermediate { background: rgba(34, 197, 94, 0.16); color: var(--green); }
    .rank-Avanzato, .rank-Advanced { background: var(--orange-glow); color: var(--orange); }
    .rank-Élite, .rank-Elite { background: rgba(168, 85, 247, 0.2); color: var(--purple); border: 1px solid rgba(168,85,247,0.4); }

    /* BUTTONS & INPUTS */
    .btn-primary { background: var(--orange); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 0.88rem; transition: opacity 0.15s; }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
    .btn-outline { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-size: 0.84rem; }
    .btn-danger-ghost { background: transparent; color: var(--red); border: none; font-weight: 600; cursor: pointer; padding: 6px 10px; font-size: 0.84rem; }
    .btn-icon { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 6px 9px; cursor: pointer; font-size: 0.86rem; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .input-field { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; outline: none; }
    .input-field:focus { border-color: var(--orange); }

    /* SUB-TABS & CHIPS */
    .subtab-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); padding: 5px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; }
    .subtab-btn { background: transparent; border: none; color: var(--muted); font-weight: 700; font-size: 0.82rem; padding: 8px; border-radius: 8px; cursor: pointer; }
    .subtab-btn.active { background: var(--orange); color: #fff; }
    .chip-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip-bar::-webkit-scrollbar { display: none; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); border-radius: 99px; padding: 6px 13px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* BODYWEIGHT ROTARY DRUM PICKER */
    .bw-wheel-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
    .bw-drum {
      height: 54px; width: 112px; overflow-y: scroll; scroll-snap-type: y mandatory;
      background: var(--bg); border: 1px solid var(--orange); border-radius: 10px;
      text-align: center; scrollbar-width: none; position: relative;
    }
    .bw-drum::-webkit-scrollbar { display: none; }
    .bw-drum-item { height: 54px; line-height: 54px; scroll-snap-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 1.15rem; color: var(--orange); }

    /* WORKOUT LOGGER */
    .workout-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .ex-log-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .prev-ghost { font-size: 0.78rem; color: var(--orange); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
    .notes-input { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--muted); font-size: 0.82rem; padding: 6px 0; margin: 6px 0 10px; outline: none; }
    .sets-head, .set-row { display: grid; grid-template-columns: 24px 50px 1fr 1fr 42px 42px 34px; gap: 5px; align-items: center; text-align: center; }
    .sets-head { font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .set-row { padding: 4px 0; border-radius: 8px; transition: background 0.2s; }
    .set-done { background: rgba(34, 197, 94, 0.13); }
    .set-pr-row { box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.5); }
    .set-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .set-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 3px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.88rem; }
    .set-select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 2px; font-weight: 700; font-size: 0.76rem; text-align: center; }
    .type-W { color: var(--blue); } .type-D { color: var(--gold); } .type-F { color: var(--red); } .type-RP { color: var(--purple); }
    .set-check { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; margin: 0 auto; }

    /* PLATE CALCULATOR VISUAL */
    .plate-bar-visual { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 18px 10px; background: var(--bg); border-radius: 12px; margin: 12px 0; min-height: 96px; }
    .bar-shaft { width: 34px; height: 12px; background: #71717A; border-radius: 2px; }
    .plate-disc { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 800; color: #fff; writing-mode: vertical-rl; text-orientation: mixed; }

    /* ANATOMY SVG & DONUT CHART */
    .anatomy-container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 16px; padding: 10px 0; }
    .body-svg { width: 135px; height: 250px; }
    .donut-wrapper { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .legend-list { display: grid; gap: 6px; font-size: 0.8rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* EXERCISE TECHNICAL ILLUSTRATION BOX */
    .tech-diagram-box { background: #0E0E12; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
    .alt-box { background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin-top: 8px; border-left: 3px solid var(--orange); }

    /* HISTORY CARDS & CALENDAR */
    .history-card { border-left: 3px solid var(--orange); cursor: pointer; }
    .history-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--surface-2); padding: 8px 10px; border-radius: 10px; margin: 10px 0; text-align: center; }
    .history-details-drawer { border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 10px; display: none; }
    .history-card.expanded .history-details-drawer { display: block; }
    .suggestion-box { background: var(--orange-glow); border: 1px solid rgba(255,85,0,0.4); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.84rem; margin-top: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .cal-day { background: var(--surface-2); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; min-height: 42px; }
    .cal-trained { background: var(--orange); color: #fff; font-weight: 700; }
    .cal-today { border: 1px solid #fff; }
    .cal-suggested { border: 1px dashed var(--orange); color: var(--orange); }
    .chart-svg { width: 100%; height: 150px; background: var(--surface-2); border-radius: 10px; margin: 8px 0; }
    .muscle-bars-grid { display: grid; gap: 10px; margin-top: 12px; }
    .progress-track { width: 100%; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; border-radius: 99px; }

    /* CUSTOM MODAL / BOTTOM SHEET */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; padding: 20px; animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* AI COACH & REPORTS */
    .chat-box { min-height: 220px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; max-width: 90%; }
    .msg-user { background: var(--orange); color: #fff; align-self: flex-end; }
    .msg-ai { background: var(--surface-2); border: 1px solid var(--border); align-self: flex-start; }
    .report-box { background: linear-gradient(145deg, #17171D 0%, #121216 100%); border: 1px solid rgba(255,85,0,0.35); border-radius: 14px; padding: 14px; font-size: 0.88rem; line-height: 1.55; margin-top: 10px; }

    /* NAVIGATION BAR */
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(18, 18, 22, 0.96); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px;
    }
    .nav-btn { background: transparent; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; font-weight: 600; cursor: pointer; padding: 4px 8px; }
    .nav-btn.active { color: var(--orange); }
    .nav-icon { font-size: 1.18rem; }

    /* TABLET & DESKTOP (XIAOMI PAD 7 PRO 11.2") */
    @media (min-width: 768px) {
      body { padding-bottom: 0; padding-left: 215px; }
      .nav-bar {
        top: 0; right: auto; width: 215px; flex-direction: column; justify-content: flex-start;
        border-top: none; border-right: 1px solid var(--border); padding: 72px 12px 16px; gap: 8px;
      }
      .nav-btn { flex-direction: row; font-size: 0.9rem; padding: 12px 14px; border-radius: 12px; width: 100%; gap: 12px; }
      .nav-btn.active { background: var(--orange-glow); }
      .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .muscle-bars-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .modal-backdrop { align-items: center; }
      .modal-sheet { border-radius: 20px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR MINIMAL -->
  <header class="top-bar">
    <div class="brand">APEX<span>IRON</span> <span class="ver-pill">v4.2</span></div>
    <div class="row-gap">
      <button class="btn-icon small" id="sync-status-btn" onclick="state.analyticsSubTab='calendar';switchTab('analytics')" title="Cloud Sync">☁️</button>
      <button class="btn-icon small" id="lang-toggle" onclick="toggleLanguage()">IT</button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main id="main-content"></main>

  <!-- MODALE CUSTOM -->
  <div id="custom-modal" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" id="modal-body"></div>
  </div>

  <!-- NAVIGAZIONE PRINCIPALE A 5 TAB -->
  <nav class="nav-bar">
    <button class="nav-btn active" data-tab="workout" onclick="switchTab('workout')">
      <span class="nav-icon">🏋️</span><span data-i18n="nav_workout">Workout</span>
    </button>
    <button class="nav-btn" data-tab="routines" onclick="switchTab('routines')">
      <span class="nav-icon">📋</span><span data-i18n="nav_routines">Schede</span>
    </button>
    <button class="nav-btn" data-tab="exercises" onclick="switchTab('exercises')">
      <span class="nav-icon">📖</span><span data-i18n="nav_exercises">Esercizi</span>
    </button>
    <button class="nav-btn" data-tab="analytics" onclick="switchTab('analytics')">
      <span class="nav-icon">📊</span><span data-i18n="nav_analytics">Analisi</span>
    </button>
    <button class="nav-btn" data-tab="coach" onclick="switchTab('coach')">
      <span class="nav-icon">🤖</span><span data-i18n="nav_coach">AI Coach</span>
    </button>
  </nav>

  <script>
    // ================= MANIFEST PWA DINAMICO =================
    (function setupManifest() {
      const manifest = {
        name: "APEX IRON v4.2 — Pro Gym & Calisthenics Tracker",
        short_name: "APEX IRON",
        start_url: location.href,
        display: "standalone",
        background_color: "#09090B",
        theme_color: "#09090B",
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2309090B'/%3E%3Cpath d='M110 216h40v80h-40zm252 0h40v80h-40zM166 176h36v160h-36zm144 0h36v160h-36zM202 240h108v32H202z' fill='%23FF5500'/%3E%3C/svg%3E",
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
    })();

    // ================= DIAGRAMMI VETTORIALI ESPLICATIVI ESERCIZI =================
    function getExerciseDiagramSVG(ex) {
      const p = ex.primary;
      if (p === 'chest' || p === 'triceps') {
        return `<svg width="220" height="84" viewBox="0 0 220 84">
          <line x1="30" y1="68" x2="190" y2="68" stroke="#3F3F46" stroke-width="4" stroke-linecap="round"/>
          <rect x="65" y="54" width="90" height="8" rx="4" fill="#FF5500"/>
          <circle cx="110" cy="44" r="9" fill="#E4E4E7"/>
          <line x1="75" y1="30" x2="145" y2="30" stroke="#F4F4F6" stroke-width="3"/>
          <rect x="68" y="18" width="6" height="24" rx="2" fill="#FF5500"/>
          <rect x="146" y="18" width="6" height="24" rx="2" fill="#FF5500"/>
          <path d="M110 26 L110 10 M105 15 L110 10 L115 15" stroke="#22C55E" stroke-width="2" fill="none"/>
          <text x="110" y="81" fill="#8E8E9E" font-size="9" text-anchor="middle">Scapole addotte • Gomiti ~45° • Spinta verticale</text>
        </svg>`;
      }
      if (p === 'back_lats' || p === 'back_upper' || p === 'biceps') {
        return `<svg width="220" height="84" viewBox="0 0 220 84">
          <line x1="50" y1="14" x2="170" y2="14" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
          <circle cx="110" cy="34" r="9" fill="#E4E4E7"/>
          <path d="M82 22 L98 44 M138 22 L122 44" stroke="#F4F4F6" stroke-width="3" stroke-linecap="round"/>
          <path d="M85 45 L85 60 M80 55 L85 60 L90 55" stroke="#22C55E" stroke-width="2" fill="none"/>
          <path d="M135 45 L135 60 M130 55 L135 60 L140 55" stroke="#22C55E" stroke-width="2" fill="none"/>
          <text x="110" y="79" fill="#8E8E9E" font-size="9" text-anchor="middle">Depressione scapolare • Gomiti verso i fianchi</text>
        </svg>`;
      }
      if (p === 'quads' || p === 'hamstrings' || p === 'glutes' || p === 'calves') {
        return `<svg width="220" height="84" viewBox="0 0 220 84">
          <line x1="30" y1="70" x2="190" y2="70" stroke="#3F3F46" stroke-width="3"/>
          <circle cx="105" cy="18" r="8" fill="#E4E4E7"/>
          <path d="M105 26 L92 48 L118 54 L112 70" stroke="#F4F4F6" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
          <circle cx="92" cy="48" r="4" fill="#FF5500"/>
          <circle cx="118" cy="54" r="4" fill="#22C55E"/>
          <text x="110" y="81" fill="#8E8E9E" font-size="9" text-anchor="middle">Schiena neutra • Spinta sul centro del piede</text>
        </svg>`;
      }
      if (p.startsWith('shoulders')) {
        return `<svg width="220" height="84" viewBox="0 0 220 84">
          <circle cx="110" cy="24" r="8" fill="#E4E4E7"/>
          <path d="M96 36 L124 36 L118 64 L102 64 Z" fill="#272730"/>
          <path d="M96 36 L66 32 M124 36 L154 32" stroke="#F4F4F6" stroke-width="3" stroke-linecap="round"/>
          <path d="M68 48 A 24 24 0 0 1 66 28" stroke="#FF5500" stroke-width="2" fill="none"/>
          <path d="M152 48 A 24 24 0 0 0 154 28" stroke="#FF5500" stroke-width="2" fill="none"/>
          <text x="110" y="80" fill="#8E8E9E" font-size="9" text-anchor="middle">Piano scapolare • Controllo fase eccentrica</text>
        </svg>`;
      }
      return `<svg width="220" height="84" viewBox="0 0 220 84">

    // ================= CLOUD SYNC FIREBASE CON MERGE INTELLIGENTE =================
    let syncEventSource = null;

    function updateSyncIcon(status) {
      const btn = document.getElementById('sync-status-btn');
      if (!btn) return;
      btn.textContent = status === 'synced' ? '☁️✅' : status === 'syncing' ? '☁️🔄' : status === 'error' ? '☁️⚠️' : '☁️';
    }

    function getCleanFirebaseEndpoint() {
      const url = (state.fbUrl || '').trim().replace(/\/+$/, '');
      const pin = (state.fbPin || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
      return (url && pin) ? `${url}/${pin}.json` : null;
    }

    function mergeById(localArr, remoteArr) {
      const map = new Map();
      (remoteArr || []).forEach(item => map.set(item.id, item));
      (localArr || []).forEach(item => map.set(item.id, item));
      return Array.from(map.values());
    }

    async function pushToCloud() {
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint) return;
      updateSyncIcon('syncing');
      try {
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bodyweight: state.bodyweight,
            customExercises: state.customExercises,
            routines: state.routines,
            history: state.history,
            activeWorkout: state.activeWorkout,
            lastUpdated: state.lastUpdated
          })
        });
        updateSyncIcon(res.ok ? 'synced' : 'error');
      } catch (e) { updateSyncIcon('error'); }
    }

    async function pullFromCloud(forceOverwrite = false) {
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint) return;
      updateSyncIcon('syncing');
      try {
        const res = await fetch(endpoint);
        if (!res.ok) { updateSyncIcon('error'); return; }
        const remote = await res.json();
        if (remote && (forceOverwrite || (remote.lastUpdated && remote.lastUpdated > state.lastUpdated))) {
          if (remote.bodyweight) state.bodyweight = remote.bodyweight;
          if (remote.customExercises) state.customExercises = mergeById(state.customExercises, remote.customExercises);
          if (remote.routines) state.routines = forceOverwrite ? remote.routines : mergeById(state.routines, remote.routines);
          if (remote.history) state.history = forceOverwrite ? remote.history : mergeById(state.history, remote.history);
          if ('activeWorkout' in remote) state.activeWorkout = remote.activeWorkout;
          state.lastUpdated = remote.lastUpdated || Date.now();
          persistLocalOnly();
          renderCurrentView();
        } else if (!remote && state.history.length > 0) {
          await pushToCloud();
        }
        updateSyncIcon('synced');
      } catch (e) { updateSyncIcon('error'); }
    }

    function startRealtimeSyncListener() {
      if (syncEventSource) { syncEventSource.close(); syncEventSource = null; }
      const endpoint = getCleanFirebaseEndpoint();
      if (!endpoint) { updateSyncIcon('idle'); return; }
      pullFromCloud();
      try {
        syncEventSource = new EventSource(endpoint);
        syncEventSource.addEventListener('put', (e) => {
          const remote = JSON.parse(e.data).data;
          if (remote && remote.lastUpdated && remote.lastUpdated > state.lastUpdated) {
            if (remote.bodyweight) state.bodyweight = remote.bodyweight;
            if (remote.customExercises) state.customExercises = mergeById(state.customExercises, remote.customExercises);
            if (remote.routines) state.routines = mergeById(state.routines, remote.routines);
            if (remote.history) state.history = mergeById(state.history, remote.history);
            if ('activeWorkout' in remote) state.activeWorkout = remote.activeWorkout;
            state.lastUpdated = remote.lastUpdated;
            persistLocalOnly();
            renderCurrentView();
            updateSyncIcon('synced');
          }
        });
      } catch (e) {}
    }

      localStorage.setItem('apex_lang', state.lang);

    function openPlateCalculatorModal(initialWeight = 60) {
      const renderPlates = (w) => {
        const total = parseFloat(w) || 20;
        if (total <= 20) return `<p class="muted small" style="text-align:center;padding:20px">Solo bilanciere olimpico (20 kg) senza dischi.</p>`;
        let perSide = (total - 20) / 2;
        const avail = [
          { kg: 25, color: '#EF4444', h: 68 },
          { kg: 20, color: '#3B82F6', h: 64 },
          { kg: 15, color: '#EAB308', h: 58 },
          { kg: 10, color: '#22C55E', h: 50 },
          { kg: 5, color: '#F4F4F6', h: 42, darkText: true },
          { kg: 2.5, color: '#71717A', h: 36 },
          { kg: 1.25, color: '#52525B', h: 30 }
        ];
        const discs = [];
        avail.forEach(p => {
          while (perSide >= p.kg - 0.001) {
            discs.push(p);
            perSide -= p.kg;
          }
        });
        return `
          <div class="plate-bar-visual">
            <div class="bar-shaft"></div>
            ${discs.map(d => `<div class="plate-disc" style="background:${d.color};height:${d.h}px;width:22px;${d.darkText?'color:#000':''}">${d.kg}</div>`).join('')}
          </div>
          <p class="small" style="text-align:center"><strong>Per lato:</strong> ${discs.map(d => d.kg + 'kg').join(' + ') || '0kg'} ${perSide > 0.1 ? `(resto ${perSide.toFixed(2)}kg)` : ''}</p>
        `;
      };

      openModal(`
        <div class="ex-log-header">
          <h3>🏋️ Plate Calculator (Bilanciere 20kg)</h3>
          <button class="btn-icon" onclick="closeModal()">✕</button>

            oninput="document.getElementById('plate-render-area').innerHTML = (${renderPlates.toString()})(this.value)">
          <span class="mono">KG</span>
        </div>
        <div id="plate-render-area">${renderPlates(initialWeight || 60)}</div>
      `);

    // ================= TIMER DI RECUPERO (CONTESTUALE AL WORKOUT) =================
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } catch (e) {}
    }

    function formatTime(sec) {
      return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      const disp = document.getElementById('timer-display');
      const bar = document.getElementById('timer-progress');
      const toggleBtn = document.getElementById('timer-toggle-btn');
      if (!disp) return;
      disp.textContent = formatTime(state.timer.remaining);
      if (bar) bar.style.width = `${Math.min(100, (state.timer.remaining / Math.max(1, state.timer.defaultSeconds)) * 100)}%`;
      if (toggleBtn) toggleBtn.textContent = state.timer.running ? '⏸' : '▶';
    }

    function startTimer(customSec = null) {
      if (customSec !== null) { state.timer.defaultSeconds = customSec; state.timer.remaining = customSec; }
      clearInterval(state.timer.interval);
      state.timer.running = true;
      updateTimerUI();
      state.timer.interval = setInterval(() => {
        if (state.timer.remaining > 0) { state.timer.remaining--; updateTimerUI(); }
        else { clearInterval(state.timer.interval); state.timer.running = false; updateTimerUI(); playBeep(); }
      }, 1000);
    }

    function toggleTimer() {
      if (state.timer.running) { clearInterval(state.timer.interval); state.timer.running = false; updateTimerUI(); }
      else { if (state.timer.remaining === 0) state.timer.remaining = state.timer.defaultSeconds; startTimer(); }
    }

    function adjustTimer(delta) {
      state.timer.remaining = Math.max(0, state.timer.remaining + delta);
      if (state.timer.remaining > state.timer.defaultSeconds) state.timer.defaultSeconds = state.timer.remaining;
      updateTimerUI();
    }

    // ================= RANKING DI FORZA & RECORD PERSONALI (PR) =================
    function getBest1RMForExercise(exerciseId) {
      let best1RM = 0, bestWeight = 0;
      state.history.forEach(w => {
        const ex = w.exercises.find(e => e.exerciseId === exerciseId);
        if (ex) {
          ex.sets.forEach(s => {
            if (s.done && s.type !== 'W') {
              const kg = parseFloat(s.weight) || 0;
              const reps = parseInt(s.reps) || 0;
              const est = kg * (1 + reps / 30);
              if (est > best1RM) best1RM = est;
              if (kg > bestWeight) bestWeight = kg;
            }
          });
        }
      });
      return { best1RM: Math.round(best1RM * 10) / 10, bestWeight };
    }

    function calculateStrengthRank(exerciseId, oneRM) {
      if (!oneRM || oneRM <= 0) return state.lang === 'it' ? 'Novizio' : 'Novice';
      const bw = Math.max(40, state.bodyweight || 75);
      const isBwWeighted = (exerciseId === 'pullups_pronated' || exerciseId === 'chinups_supinated' || exerciseId === 'dips_chest');
      const effectiveLoad = isBwWeighted ? (bw + oneRM) : oneRM;
      const ratio = effectiveLoad / bw;
      const std = STRENGTH_STANDARDS[exerciseId] || [0.4, 0.7, 1.0, 1.3];

      const labels = state.lang === 'it'
        ? ['Novizio', 'Principiante', 'Intermedio', 'Avanzato', 'Élite']
        : ['Novice', 'Beginner', 'Intermediate', 'Advanced', 'Elite'];

      if (ratio >= std[3]) return labels[4];
      if (ratio >= std[2]) return labels[3];
      if (ratio >= std[1]) return labels[2];
      if (ratio >= std[0]) return labels[1];
      return labels[0];
    }

    function repeatPastWorkout(historyIndex) {

      if (!past) return;
      state.activeWorkout = {
        id: 'w_' + Date.now(),
        name: past.name,
        routineId: past.routineId || null,
        startTime: Date.now(),
        exercises: past.exercises.map(ex => ({
          exerciseId: ex.exerciseId,
          notes: ex.notes || '',
          sets: ex.sets.map(s => ({ ...s, done: false, isPR: false }))
        }))
      };
      saveState();
      switchTab('workout');
    }

    function getPreviousPerformance(exerciseId) {
      for (let i = state.history.length - 1; i >= 0; i--) {
        const found = state.history[i].exercises.find(e => e.exerciseId === exerciseId);
        if (found && found.sets.some(s => s.done)) {
          const valid = found.sets.filter(s => s.done && s.type !== 'W');
          const list = valid.length ? valid : found.sets.filter(s => s.done);
          return list.map(s => `${s.weight || 0}kg×${s.reps || 0}${s.rir !== '' ? `@RIR${s.rir}` : ''}`).join(' | ');
        }
      }
      return null;
    }

    function copyLastSetValues(exIndex) {
      const ex = state.activeWorkout.exercises[exIndex];
      if (!ex.sets.length) return;
      // Trova l'ultima serie compilata oppure l'ultimo storico
      let refW = '', refR = '';
      for (let i = ex.sets.length - 1; i >= 0; i--) {
        if (ex.sets[i].weight || ex.sets[i].reps) { refW = ex.sets[i].weight; refR = ex.sets[i].reps; break; }
      }
      if (!refW && !refR) {
        for (let i = state.history.length - 1; i >= 0; i--) {
          const found = state.history[i].exercises.find(e => e.exerciseId === ex.exerciseId);
          if (found && found.sets.length) { refW = found.sets[0].weight; refR = found.sets[0].reps; break; }
        }
      }
      const targetSet = ex.sets.find(s => !s.done) || ex.sets[ex.sets.length - 1];
      if (refW) targetSet.weight = refW;
      if (refR) targetSet.reps = refR;
      saveState(); renderWorkoutTab();
    }

    function addSetToActive(exIndex) {
      const ex = state.activeWorkout.exercises[exIndex];
      const last = ex.sets[ex.sets.length - 1] || { type: 'N', weight: '', reps: '', rir: '2', rpe: '8' };
      ex.sets.push({ ...last, done: false, isPR: false });
      saveState(); renderWorkoutTab();
    }

    function updateSetField(exIndex, setIndex, field, value) {
      const exItem = state.activeWorkout.exercises[exIndex];
      const set = exItem.sets[setIndex];
      set[field] = value;
      if (field === 'done' && value === true) {
        startTimer(state.timer.defaultSeconds);
        const kg = parseFloat(set.weight) || 0;
        const reps = parseInt(set.reps) || 0;
        if (kg > 0 && reps > 0 && set.type !== 'W') {
          const est = kg * (1 + reps / 30);
          const { best1RM } = getBest1RMForExercise(exItem.exerciseId);
          set.isPR = est > best1RM;
        }
      }
      saveState();
      if (field === 'done' || field === 'type') renderWorkoutTab();
    }

    function removeSet(exIndex, setIndex) {
      state.activeWorkout.exercises[exIndex].sets.splice(setIndex, 1);
      saveState(); renderWorkoutTab();
    }

    function finishWorkout() {
      if (!state.activeWorkout) return;
      const durationMin = Math.max(1, Math.round((Date.now() - state.activeWorkout.startTime) / 60000));
      let totalVolume = 0, prCount = 0;
      state.activeWorkout.exercises.forEach(ex => ex.sets.forEach(s => {
        if (s.done) {
          totalVolume += (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
          if (s.isPR) prCount++;
        }
      }));
      state.history.push({ ...state.activeWorkout, date: new Date().toISOString(), durationMin, totalVolume, prCount });
      state.activeWorkout = null;
      clearInterval(state.timer.interval); state.timer.running = false;
      saveState();
      state.analyticsSubTab = 'history';
      switchTab('analytics');
    }

    // ================= CALCOLI MUSCOLARI & RECUPERO =================
    function calculateMuscleStats(daysBack = 7) {
      const cutoff = Date.now() - daysBack * 86400000;
      const stats = {};
      Object.keys(MUSCLE_GROUPS).forEach(m => stats[m] = { sets: 0, lastTrained: null, recoveryPct: 100 });
      state.history.forEach(w => {
        const wTime = new Date(w.date).getTime();
        w.exercises.forEach(exItem => {
          const dbEx = getExercise(exItem.exerciseId);
          const workingSets = exItem.sets.filter(s => s.done && s.type !== 'W').length;
          if (workingSets > 0) {
            if (!stats[dbEx.primary].lastTrained || wTime > stats[dbEx.primary].lastTrained) stats[dbEx.primary].lastTrained = wTime;
            if (wTime >= cutoff) {
              stats[dbEx.primary].sets += workingSets;
              (dbEx.secondary || []).forEach(sec => { if (stats[sec]) stats[sec].sets += workingSets * 0.5; });
            }
          }
        });
      });
      const now = Date.now();
      Object.keys(stats).forEach(m => {
        const reqHours = MUSCLE_GROUPS[m].recoveryHours;
        if (stats[m].lastTrained && reqHours > 0) {
          stats[m].recoveryPct = Math.min(100, Math.round(((now - stats[m].lastTrained) / 3600000 / reqHours) * 100));
        }
      });
      return stats;
    }

    function getSuggestedNextWorkout() {
      if (!state.routines.length) return null;
      const muscleStats = calculateMuscleStats(7);
      let bestRoutine = state.routines[0], bestScore = -1;
      state.routines.forEach(r => {
        if (!r.exercises.length) return;
        let sumRec = 0;
        r.exercises.forEach(exId => { sumRec += (muscleStats[getExercise(exId).primary]?.recoveryPct ?? 100); });
        const avgRec = sumRec / r.exercises.length;
        if (avgRec > bestScore) { bestScore = avgRec; bestRoutine = r; }
      });
      return { routine: bestRoutine, readiness: Math.round(bestScore) };
    }

    function getExerciseProgression(exerciseId) {
      const points = [];
      state.history.forEach(w => {
        const ex = w.exercises.find(e => e.exerciseId === exerciseId);
        if (ex) {
          let max1RM = 0, vol = 0;
          ex.sets.forEach(s => {
            if (s.done && s.type !== 'W') {
              const kg = parseFloat(s.weight) || 0, reps = parseInt(s.reps) || 0;
              vol += kg * reps;
              const est = kg * (1 + reps / 30);
              if (est > max1RM) max1RM = est;
            }
          });
          if (max1RM > 0 || vol > 0) {
            points.push({
              date: new Date(w.date).toLocaleDateString(state.lang === 'it' ? 'it-IT' : 'en-US', { day: '2-digit', month: '2-digit' }),
              oneRM: Math.round(max1RM * 10) / 10, volume: Math.round(vol)
            });
          }
        }
      });
      return points;
    }

    function renderSVGChart(points) {
      if (!points.length) return `<p class="muted small" style="padding:16px 0">${state.lang === 'it' ? 'Registra almeno un allenamento con questo esercizio per il grafico.' : 'Log a workout to see chart.'}</p>`;
      const maxVal = Math.max(...points.map(p => p.oneRM), 10), w = 320, h = 140, pad = 20;
      const coords = points.map((p, i) => `${points.length === 1 ? w / 2 : pad + (i / (points.length - 1)) * (w - pad * 2)},${h - pad - ((p.oneRM / maxVal) * (h - pad * 2))}`).join(' ');
      return `
        <svg viewBox="0 0 ${w} ${h}" class="chart-svg">
          <polyline fill="none" stroke="#FF5500" stroke-width="3" points="${coords}" />
          ${points.map((p, i) => {
            const x = points.length === 1 ? w / 2 : pad + (i / (points.length - 1)) * (w - pad * 2);
            const y = h - pad - ((p.oneRM / maxVal) * (h - pad * 2));
            return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#FF5500" stroke-width="2" /><text x="${x}" y="${y - 8}" fill="#fff" font-size="10" text-anchor="middle">${p.oneRM}kg</text>`;
          }).join('')}
        </svg>
      `;
    }

    function exportBackup() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ bodyweight: state.bodyweight, customExercises: state.customExercises, routines: state.routines, history: state.history }, null, 2)], { type: 'application/json' }));
      a.download = `apex-iron-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.bodyweight) state.bodyweight = parsed.bodyweight;
          if (parsed.customExercises) state.customExercises = parsed.customExercises;
          if (parsed.routines) state.routines = parsed.routines;
          if (parsed.history) state.history = parsed.history;
          saveState(); renderAnalyticsTab();
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    async function generateAiRoutine() {
      const goal = document.getElementById('ai-routine-goal').value.trim() || 'Full Body ipertrofia';
      closeModal();
      state.chatMessages.push({ role: 'user', text: `✨ Crea scheda: ${goal}` });
      renderCoachTab();

      const availableIds = getAllExercises().map(e => `${e.id} (${e.name.it})`).join(', ');
      const prompt = `Crea una scheda di allenamento per: "${goal}".
Scegli SOLO tra questi ID esercizi esatti: ${availableIds}.
Rispondi EXCLUSIVAMENTE con un oggetto JSON valido senza markdown, in questo formato:
{"name": "Nome Scheda", "exercises": ["id_1", "id_2", "id_3", "id_4", "id_5"]}`;

      const raw = await callGeminiEngine(prompt, '');
      try {
        const jsonMatch = raw.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const parsed = JSON.parse(jsonMatch[0]);
          if (parsed.name && Array.isArray(parsed.exercises) && parsed.exercises.length > 0) {
            const validIds = parsed.exercises.filter(id => getAllExercises().some(e => e.id === id));
            if (validIds.length > 0) {
              state.routines.push({ id: 'r_ai_' + Date.now(), name: `✨ ${parsed.name}`, exercises: validIds });
              saveState();
              state.chatMessages.push({

              });
              renderCoachTab();
              return;
            }
          }
        }
      } catch (e) {}

      state.chatMessages.push({ role: 'ai', text: raw || '⚠️ Impossibile generare la scheda in questo momento. Riprova tra poco.' });
      renderCoachTab();
    }

    async function callGeminiEngine(promptText, fallbackText) {
      const cleanKey = (state.geminiKey || '').trim();
      if (!cleanKey) return fallbackText;
      try {
        let candidateModels = ['models/gemini-3.8-flash', 'models/gemini-2.5-flash'];
        const listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
          headers: { 'x-goog-api-key': cleanKey }
        });
        if (listRes.ok) {
          const listData = await listRes.json();
          const validModels = (listData.models || [])
            .filter(m => m.name.includes('gemini') && !m.name.includes('image') && !m.name.includes('tts') && (m.supportedGenerationMethods || []).includes('generateContent'))
            .map(m => m.name);
          validModels.sort((a, b) => (a.includes('lite') ? -1 : b.includes('lite') ? 1 : a.includes('flash') ? -1 : 1));
          if (validModels.length) candidateModels = validModels;
        }
        for (const modelName of candidateModels.slice(0, 5)) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cleanKey },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: { maxOutputTokens: 1024, temperature: 0.7 }
            })
          });
          const data = await res.json();
          if (res.ok) {
            const parts = data.candidates?.[0]?.content?.parts || [];
            const textBlocks = parts.filter(p => p.text && !p.thought).map(p => p.text).join('\n').trim();
            const rawText = parts.map(p => p.text || '').join('\n').trim();
            if (textBlocks || rawText) return textBlocks || rawText;
          } else if (res.status !== 503 && res.status !== 429 && res.status !== 404) {
            return `⚠️ Errore API (${res.status}): ${data.error?.message || 'Errore'}`;
          }
        }
      } catch (e) {}
      return fallbackText;
    }

    async function generatePeriodicReport(days) {
      state.latestReport = state.lang === 'it' ? '⏳ Generazione report in corso...' : '⏳ Generating report...';
      renderCoachTab();

      const cutoff = Date.now() - days * 86400000;
      const periodWorkouts = state.history.filter(w => new Date(w.date).getTime() >= cutoff);
      const totalVol = periodWorkouts.reduce((acc, w) => acc + (w.totalVolume || 0), 0);
      const muscleStats = calculateMuscleStats(days);
      const summaryContext = Object.keys(muscleStats).filter(m => muscleStats[m].sets > 0)
        .map(m => `${MUSCLE_GROUPS[m][state.lang]}: ${muscleStats[m].sets} serie`).join(', ');

      const fallback = state.lang === 'it'
        ? `📊 **Report ${days === 7 ? 'Settimanale' : 'Mensile'} (Locale)**\n• Sessioni completate: ${periodWorkouts.length}\n• Tonnellaggio totale: ${Math.round(totalVol)} kg\n• Distribuzione: ${summaryContext || 'Nessun dato nel periodo'}\n• Consiglio: Verifica che i gruppi carenti raggiungano almeno 10 serie settimanali.`
        : `📊 **${days === 7 ? 'Weekly' : 'Monthly'} Report (Local)**\n• Sessions: ${periodWorkouts.length}\n• Total Tonnage: ${Math.round(totalVol)} kg\n• Distribution: ${summaryContext || 'No data'}\n• Tip: Ensure lagging muscles hit at least 10 sets/week.`;

      const prompt = `Genera un Report ${days === 7 ? 'Settimanale' : 'Mensile'} sintetico e professionale da Personal Trainer in ${state.lang === 'it' ? 'italiano' : 'inglese'}.
Peso atleta: ${state.bodyweight} kg.
Sessioni negli ultimi ${days} giorni: ${periodWorkouts.length}.
Volume sollevato totale: ${Math.round(totalVol)} kg.
Serie per muscolo: ${summaryContext || 'nessuna'}.
Struttura il report in 3 punti brevi: 1) Valutazione Aderenza & Volume, 2) Squilibri o Muscoli Carenti, 3) Obiettivo concreto per i prossimi 7 giorni.`;

      state.latestReport = await callGeminiEngine(prompt, fallback);
      persistLocalOnly();
      renderCoachTab();
    }

    async function askCoach() {
      const input = document.getElementById('coach-input');
      const question = input ? input.value.trim() : '';
      if (!question) return;
      input.value = '';
      state.chatMessages.push({ role: 'user', text: question });
      renderCoachTab();

      const muscleStats = calculateMuscleStats(7);
      const summaryContext = Object.keys(muscleStats).filter(m => muscleStats[m].sets > 0)
        .map(m => `${MUSCLE_GROUPS[m][state.lang]}: ${muscleStats[m].sets} serie (${muscleStats[m].recoveryPct}% rec)`).join(', ');

      const fallback = state.lang === 'it'
        ? `📊 Analisi Locale (Peso: ${state.bodyweight}kg, Storico: ${state.history.length} sessioni): ${summaryContext || 'Nessuna serie negli ultimi 7gg'}.`
        : `📊 Local Analysis (BW: ${state.bodyweight}kg, History: ${state.history.length} sessions): ${summaryContext || 'No sets in last 7d'}.`;

      const prompt = `Sei un coach esperto di bodybuilding e calisthenics. Rispondi in ${state.lang === 'it' ? 'italiano' : 'inglese'} in modo concreto.\nPeso atleta: ${state.bodyweight}kg. Allenamenti totali: ${state.history.length}. Volume 7gg: ${summaryContext || 'nessuno'}.\nDomanda: ${question}`;
      const reply = await callGeminiEngine(prompt, fallback);
      state.chatMessages.push({ role: 'ai', text: reply });
      renderCoachTab();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateStaticLabels();
      renderCurrentView();
      startRealtimeSyncListener();
    });
  </script>
</body>
</html>
